<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-wrap">
            <h2>Product Finder</h2>
            <div class="nav-buttons">
                <button id="allBtn" class="nav-btn active">All Products</button>
                <button id="savedBtn" class="nav-btn">Saved (<span id="savedCount">0</span>)</button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="filters">
            <input type="text" id="searchInput" placeholder="Search product...">
            <select id="categorySelect">
                <option value="all">All Categories</option>
            </select>
            <select id="sortSelect">
                <option value="default">Sort By</option>
                <option value="low">Price: Low to High</option>
                <option value="high">Price: High to Low</option>
            </select>
        </div>

        <div class="top-info">
            <h3 id="pageHeading">All Products</h3>
            <span id="itemCount">0 items</span>
        </div>

        <div id="loadingBox" class="status-box">
            <div class="loader"></div>
            <p>Loading products...</p>
        </div>

        <div id="errorBox" class="status-box error-box" style="display: none;">
            <p>Something went wrong while fetching data.</p>
            <button id="retryBtn" class="btn blue-btn">Retry</button>
        </div>

        <div id="emptyBox" class="status-box" style="display: none;">
            <p>No products found.</p>
        </div>

        <div id="productList" class="product-grid"></div>
    </div>

    <div id="detailsModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span id="closeModal" class="close-icon">&times;</span>
            <div id="modalInfo"></div>
        </div>
    </div>

    <footer class="footer">
        <p>CSE-2340 Software Development I - Mini Project</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
